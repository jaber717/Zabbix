# LAB environment. URL and token come from the environment variables named below (see .env.example).
environment: lab
auto_init_identity: true        # LAB may claim itself on first apply; production never does
suppress_stock: false           # stays false until the stock trigger prototypes can be inspected (unverified that {$IFCONTROL} gates them)
zabbix:
  url_env: ZABBIX_URL_LAB
  token_env: ZABBIX_TOKEN_LAB
  verify_tls: true
  api_version: "7.0"            # server must report 7.0.x
  # optional extra guards (regular expressions): url_regex, forbid_url_regex

# Reuse the existing Zabbix Telegram media type and the Admin user's configured destination.
# This action is filtered solely by the framework-owned `netops_alert` event tag; stock triggers
# do not carry that tag. The framework references the media type by name and never creates/changes it.
alert_action:
  name: "NETOPS-IaC Interface Alerts"   # must start with NETOPS-IaC
  enabled: true
  usergroups: ["Zabbix administrators"]
  media_type: "Telegram"
