        name: 'Trellix: Temperature not healthy'
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/Trellix by SNMP/trellix.temperature.healthy)=1
        priority: HIGH
        description: 'TruthValue false(2): the appliance reports an abnormal temperature.'
        tags:
