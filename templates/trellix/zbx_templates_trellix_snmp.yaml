zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 5f0c60664626481f800886e5b2c7561f
    name: Templates/Security
  templates:
  - uuid: 6949ec134843462580f9aecaa6e4a245
    template: Trellix by SNMP
    name: Trellix by SNMP
    description: 'Trellix (FireEye) appliance by SNMP, built from FE-FIREEYE-MIB (1.3.6.1.4.1.25597): ICMP/SNMP availability, MIB-II system data, temperature, RAID/disks, power, fans, software/content/licence state, AVC, submission totals. Link to every NX/EX/FX/AX/CM-class appliance that answers SNMP. Not verified on a live appliance.'
    groups:
    - name: Templates/Security
    items:
    - uuid: 4015fbf61a524d9c8efef5f30da3b1b3
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      valuemap:
        name: Trellix service state
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 999e9b16ea1d49918b41164d358ddbf0
        expression: max(/Trellix by SNMP/icmpping,#3)=0
        name: 'Trellix: Unavailable by ICMP ping'
        priority: HIGH
        description: No ICMP echo reply in 3 consecutive checks.
        tags:
        - tag: scope
          value: availability
    - uuid: a680ef00b57a4cda8f7bfb7a60f5e992
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: cab25697bcaf484785c6c6afcc98438f
        expression: min(/Trellix by SNMP/icmppingloss,5m)>{$TRELLIX.ICMP.LOSS.WARN} and min(/Trellix by SNMP/icmppingloss,5m)<100
        name: 'Trellix: High ICMP ping loss ({ITEM.VALUE})'
        priority: WARNING
        tags:
        - tag: scope
          value: availability
    - uuid: 6e2522f409cf4e088c3a3312c6a930f5
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 4786aeb808d14c0b8542ff9f6906598d
        expression: min(/Trellix by SNMP/icmppingsec,5m)>{$TRELLIX.ICMP.RESPONSE.TIME.WARN}
        name: 'Trellix: High ICMP ping response time ({ITEM.VALUE})'
        priority: WARNING
        tags:
        - tag: scope
          value: availability
    - uuid: da81139c7e4e43118ce31406b2a9f4fd
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      description: Availability of the SNMP interface as seen by the Zabbix server/proxy.
      valuemap:
        name: Trellix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 5569a83d211d475b8dcd0d4d07bd2c02
        expression: max(/Trellix by SNMP/zabbix[host,snmp,available],{$TRELLIX.SNMP.TIMEOUT})=0
        name: 'Trellix: No SNMP data collection'
        priority: AVERAGE
        description: 'SNMP polling failed for the whole {$TRELLIX.SNMP.TIMEOUT}: check community/credentials, the SNMP allow-list on the appliance and UDP/161 reachability. Counter64 objects need SNMPv2c or v3.'
        tags:
        - tag: scope
          value: availability
    - uuid: eb82643c958246fc8917bb8cfe7a6f3a
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: system.descr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      description: MIB-II sysDescr.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: c2c7a70d1f8447b88338dcd47c21aa2c
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: system.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      description: MIB-II sysName.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 14f24abfac1946ba8624854866f177e9
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: system.objectid
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      description: MIB-II sysObjectID (expected under 1.3.6.1.4.1.25597; not verified against a live appliance).
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 702b40a5008d48f78f55e22f1ef2fd80
      name: Uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: uptime
      description: MIB-II sysUpTime (timeticks / 100).
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 4a9cafdf9cda4819849f9b3c01f25089
        expression: last(/Trellix by SNMP/system.uptime)<10m
        name: 'Trellix: Restarted (uptime {ITEM.LASTVALUE})'
        priority: INFO
        description: 'Uptime below 10 minutes: the appliance restarted or the SNMP agent was reset.'
        tags:
        - tag: scope
          value: availability
      - uuid: 0d1987f69d3645f68258835018d881ad
        expression: nodata(/Trellix by SNMP/system.uptime,{$TRELLIX.NODATA.TIMEOUT})=1
        name: 'Trellix: No SNMP data for {$TRELLIX.NODATA.TIMEOUT}'
        priority: AVERAGE
        tags:
        - tag: scope
          value: availability
    - uuid: b06f8e1689914647882c00561a3f4e1f
      name: Hardware model
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.25597.11.1.1.2.0
      key: trellix.model
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      description: MIB object feHardwareModel (1.3.6.1.4.1.25597.11.1.1.2).
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 552898f25c564f54889230c378f9deea
      name: Serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.25597.11.1.1.3.0
      key: trellix.serial
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      description: MIB object feSerialNumber (1.3.6.1.4.1.25597.11.1.1.3).
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 85b129f3839d42508762bed9891e8e12
      name: Overall system status (text)
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.25597.11.1.1.1.0
      key: trellix.system.status
      delay: 1m
      history: 31d
      trends: '0'
      value_type: TEXT
      description: Free-text status string. The MIB does not define its possible values, so no trigger is based on it; health is judged from the *IsHealthy truth-value objects and from traps. MIB object feSystemStatus (1.3.6.1.4.1.25597.11.1.1.1).
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      tags:
      - tag: component
        value: system
    - uuid: 1a34fa50a7fe4cb2865354fb70cef250
      name: Temperature
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.25597.11.1.1.4.0
      key: trellix.temperature
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: °C
      description: System temperature in Celsius. MIB object feTemperatureValue (1.3.6.1.4.1.25597.11.1.1.4).
      tags:
      - tag: component
        value: temperature
      triggers:
      - uuid: 27fff445991f4c878c8a951ef9009c7b
        expression: min(/Trellix by SNMP/trellix.temperature,5m)>{$TRELLIX.TEMP.WARN}
        name: 'Trellix: High temperature ({ITEM.VALUE})'
        priority: WARNING
        description: The default threshold is a tunable assumption, not a vendor figure. The appliance also sends feExcessiveTemperature.
        tags:
        - tag: scope
          value: temperature
    - uuid: d0b415a85b7f49b48fd859ea543a52b7
      name: Temperature status (text)
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.25597.11.1.1.5.0
      key: trellix.temperature.status
      delay: 5m
      history: 7d
      trends: '0'
      value_type: CHAR
      description: MIB object feTemperatureStatus (1.3.6.1.4.1.25597.11.1.1.5).
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
