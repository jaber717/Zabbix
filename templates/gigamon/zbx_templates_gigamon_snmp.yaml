zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 6300edd155784a3080d6acc97d71c07e
    name: Templates/Network devices
  templates:
  - uuid: d48cd9b37e9c4c37844febc8e2e4b6f8
    template: Gigamon GigaVUE by SNMP
    name: Gigamon GigaVUE by SNMP
    description: 'Gigamon GigaVUE node by SNMP: ICMP/SNMP availability, MIB-II system data and IF-MIB interface discovery (status, 64-bit traffic, errors, discards).

      Link to every Gigamon node. Chassis hardware health (fans, power, temperature, ports, maps) is NOT covered: that lives in GIGAMON-SNMP-MIB, which was not among the MIBs this template was built from.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: a9e1c4251f464e14808263480d953d4a
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      valuemap:
        name: Gigamon service state
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: ba5a973ad52a4dfb8910c88478eb77f7
        expression: max(/Gigamon GigaVUE by SNMP/icmpping,#3)=0
        name: 'Gigamon: Unavailable by ICMP ping'
        priority: HIGH
        description: The node did not answer ICMP echo in 3 consecutive checks.
        tags:
        - tag: scope
          value: availability
    - uuid: 8760c0e9f62c44b38d007358fcdb5e26
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 3b270c507c1e49cd82b3f359095b6849
        expression: min(/Gigamon GigaVUE by SNMP/icmppingloss,5m)>{$GIGAMON.ICMP.LOSS.WARN} and min(/Gigamon GigaVUE by SNMP/icmppingloss,5m)<100
        name: 'Gigamon: High ICMP ping loss ({ITEM.VALUE})'
        priority: WARNING
        tags:
        - tag: scope
          value: availability
    - uuid: 727737f9cabc4030839a65f3236677d9
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 56f3b24216b542d78e6d87fbac68b8a6
        expression: min(/Gigamon GigaVUE by SNMP/icmppingsec,5m)>{$GIGAMON.ICMP.RESPONSE.TIME.WARN}
        name: 'Gigamon: High ICMP ping response time ({ITEM.VALUE})'
        priority: WARNING
        tags:
        - tag: scope
          value: availability
    - uuid: a6901c1cc28e4ccf85047087591bc318
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      description: Availability of the SNMP interface as seen by the Zabbix server/proxy.
      valuemap:
        name: Gigamon SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: afe4082ba17c4970842c4e62f59ffa30
        expression: max(/Gigamon GigaVUE by SNMP/zabbix[host,snmp,available],{$GIGAMON.SNMP.TIMEOUT})=0
        name: 'Gigamon: No SNMP data collection'
        priority: AVERAGE
        description: 'SNMP polling has failed for the whole {$GIGAMON.SNMP.TIMEOUT}: check community/credentials, ACLs on the node, UDP/161 path. Counter64 objects need SNMPv2c or v3.'
        tags:
        - tag: scope
          value: availability
    - uuid: 3e9e081adc6c48568657de5aa4006458
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: system.descr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      description: MIB-II sysDescr.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 84cc24daa50b4f018f1fe53b23440f60
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: system.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      description: MIB-II sysName.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 9364236d876942a186a8a4de12e374ae
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: system.objectid
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      description: MIB-II sysObjectID (a Gigamon node is expected under 1.3.6.1.4.1.26866; not verified against a live device).
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: d746eef9fcff42bb8bbf72135281a7bc
      name: Uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: uptime
      description: MIB-II sysUpTime (timeticks / 100).
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: a9899414cce14bdd87afed6c2c2823ca
        expression: last(/Gigamon GigaVUE by SNMP/system.uptime)<10m
        name: 'Gigamon: Restarted (uptime {ITEM.LASTVALUE})'
        priority: INFO
        description: 'Uptime is below 10 minutes: the node restarted or the SNMP agent was reset.'
        tags:
        - tag: scope
          value: availability
      - uuid: 44e491781871479f8bfaa0fba8ab3fb2
        expression: nodata(/Gigamon GigaVUE by SNMP/system.uptime,{$GIGAMON.NODATA.TIMEOUT})=1
        name: 'Gigamon: No SNMP data for {$GIGAMON.NODATA.TIMEOUT}'
        priority: AVERAGE
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: a74d65b7062b4e928f9ed5abd539ed62
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      description: IF-MIB interfaces. Gigamon GigaVUE physical ports are monitoring ports, so the link trigger only reacts to up->down changes.
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFNAME}'
          value: '{$GIGAMON.IF.NAME.MATCHES}'
          formulaid: A
        - macro: '{#IFNAME}'
          operator: NOT_MATCHES_REGEX
          value: '{$GIGAMON.IF.NAME.NOT_MATCHES}'
          formulaid: B
      item_prototypes:
      - uuid: 1b705e9574b642348960b5f2d4d00b64
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.status[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: UNSIGNED
        description: IF-MIB ifOperStatus. Physical monitoring/tap ports without link are normal, the trigger therefore fires only on an up->down transition.
        valuemap:
          name: Gigamon ifOperStatus
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: a432f408692944458017ace8c1e52f60
          expression: '{$GIGAMON.IFCONTROL:"{#IFNAME}"}=1 and last(/Gigamon GigaVUE by SNMP/net.if.status[{#SNMPINDEX}])=2 and (last(/Gigamon GigaVUE by SNMP/net.if.status[{#SNMPINDEX}],#1)<>last(/Gigamon GigaVUE by SNMP/net.if.status[{#SNMPINDEX}],#2))'
          name: 'Interface {#IFNAME}: Link down'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/Gigamon GigaVUE by SNMP/net.if.status[{#SNMPINDEX}])<>2 or {$GIGAMON.IFCONTROL:"{#IFNAME}"}=0
          priority: AVERAGE
          description: Operational status changed from up to down. Disable per port with {$GIGAMON.IFCONTROL:"<ifName>"}=0.
          tags:
          - tag: scope
            value: network
      - uuid: 4aa73f3dbb384e0987ed3154c0ca619a
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Gigamon ifAdminStatus
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: bcca1c8ec94641938a3c3cc1f8d84418
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 1h
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        description: ifHighSpeed (Mbps) converted to bit/s.
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1000000'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 2e667caf78c24f8f8432e52d5d864e04
        name: 'Interface {#IFNAME}: Bits received'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: bps
        description: 'ifHCInOctets as bit/s (64-bit counter: needs SNMPv2c/v3).'
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 7a5c142bcab94e058c562fcaba9b274f
        name: 'Interface {#IFNAME}: Bits sent'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: bps
        description: ifHCOutOctets as bit/s.
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 2edb18d8b31c40f486ace19ab8751bb1
        name: 'Interface {#IFNAME}: Inbound packets with errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: '!pps'
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: 1847be3ad0dd46e48d9ed9f8da1cabca
          expression: '{$GIGAMON.IFCONTROL:"{#IFNAME}"}=1 and (min(/Gigamon GigaVUE by SNMP/net.if.in.errors[{#SNMPINDEX}],5m)>{$GIGAMON.IF.ERRORS.WARN} or min(/Gigamon GigaVUE by SNMP/net.if.out.errors[{#SNMPINDEX}],5m)>{$GIGAMON.IF.ERRORS.WARN})'
          name: 'Interface {#IFNAME}: High error rate'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: max(/Gigamon GigaVUE by SNMP/net.if.in.errors[{#SNMPINDEX}],5m)<{$GIGAMON.IF.ERRORS.WARN}*0.8 and max(/Gigamon GigaVUE by SNMP/net.if.out.errors[{#SNMPINDEX}],5m)<{$GIGAMON.IF.ERRORS.WARN}*0.8
          priority: WARNING
          description: Input or output errors above {$GIGAMON.IF.ERRORS.WARN} packets/s for 5 minutes.
          tags:
          - tag: scope
            value: network
      - uuid: 12097d5475a743a785f8f95f0db197c5
        name: 'Interface {#IFNAME}: Outbound packets with errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: '!pps'
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 0fa7eb8466174f0b8c0a25eabc05c1e0
        name: 'Interface {#IFNAME}: Inbound packets discarded'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: '!pps'
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 1396c682dc6d45a58e2538d77c7ce61a
        name: 'Interface {#IFNAME}: Outbound packets discarded'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: '!pps'
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
    macros:
    - macro: '{$GIGAMON.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP loss warning threshold, %.
    - macro: '{$GIGAMON.ICMP.RESPONSE.TIME.WARN}'
      value: '0.15'
      description: ICMP response time warning threshold, seconds.
    - macro: '{$GIGAMON.SNMP.TIMEOUT}'
      value: 5m
      description: Period of failed SNMP polling before the "No SNMP data collection" trigger fires.
    - macro: '{$GIGAMON.NODATA.TIMEOUT}'
      value: 15m
      description: No-data period for sysUpTime.
    - macro: '{$GIGAMON.IF.NAME.MATCHES}'
      value: .*
      description: 'Regex: interfaces to discover.'
    - macro: '{$GIGAMON.IF.NAME.NOT_MATCHES}'
      value: ^$
      description: 'Regex: interfaces to exclude from discovery (default excludes nothing).'
    - macro: '{$GIGAMON.IFCONTROL}'
      value: '1'
      description: 1 = raise link-down and error triggers. Override per interface with {$GIGAMON.IFCONTROL:"<ifName>"}.
    - macro: '{$GIGAMON.IF.ERRORS.WARN}'
      value: '2'
      description: Interface error rate (packets/s, 5 min) that raises the warning.
    tags:
    - tag: class
      value: network
    - tag: target
      value: gigamon
    valuemaps:
    - uuid: 35000d9db8cd4f0385d326d781dfc3e9
      name: Gigamon service state
      mappings:
      - value: '0'
        newvalue: Down
      - value: '1'
        newvalue: Up
    - uuid: 65753218ee2f48608f688f59ddf618a9
      name: Gigamon SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: b9be704d329540fb88ce0749c9d2fedf
      name: Gigamon ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: b465199a21cc4c5a89bf8fc8e84d5bbd
      name: Gigamon ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  - uuid: e6689655ba9947e9845b5d98cfa7d8d8
    template: Gigamon GigaVUE Inline Bypass by SNMP
    name: Gigamon GigaVUE Inline Bypass by SNMP
    description: 'Gigamon inline bypass (GIGAMONINLINEBYPASS, 1.3.6.1.4.1.26866.4): inline tool and inline network status, heartbeat, forward state. Link only to nodes that run inline bypass.'
    groups:
    - name: Templates/Network devices
    discovery_rules:
    - uuid: 50d66168f4594889889e6fa165e58df7
      name: Inline tools discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TOOL.ALIAS},1.3.6.1.4.1.26866.4.1.1.1.2,{#TOOL.PORTA},1.3.6.1.4.1.26866.4.1.1.1.3,{#TOOL.PORTB},1.3.6.1.4.1.26866.4.1.1.1.4]
      key: gigamon.inline.tool.discovery
      delay: 1h
      lifetime: 7d
      description: 'GIGAMONINLINEBYPASS inlineToolStatusTable (1.3.6.1.4.1.26866.4.1.1). Unsupported on nodes without inline bypass: link this template only where the feature exists.'
      item_prototypes:
      - uuid: 1ab90ed3e2b64592881e2e7613d5aced
        name: 'Inline tool {#TOOL.ALIAS} [{#SNMPINDEX}]: Aggregate status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.26866.4.1.1.1.8.{#SNMPINDEX}
        key: gigamon.inline.tool.agg[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: UNSIGNED
        description: Overall state of the inline tool (disable / down / up / ready). MIB object intAggregateStatus (1.3.6.1.4.1.26866.4.1.1.1.8)
        valuemap:
          name: Gigamon inline tool aggregate status
        tags:
        - tag: component
          value: inline-bypass
        trigger_prototypes:
        - uuid: 32a15669e1754d4286633c92ff8bbcdc
          expression: '{$GIGAMON.INLINE.TOOL.CONTROL:"{#TOOL.ALIAS}"}=1 and last(/Gigamon GigaVUE Inline Bypass by SNMP/gigamon.inline.tool.agg[{#SNMPINDEX}])=1'
          name: Inline tool {#TOOL.ALIAS} [{#SNMPINDEX}] is down
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/Gigamon GigaVUE Inline Bypass by SNMP/gigamon.inline.tool.agg[{#SNMPINDEX}])<>1 or {$GIGAMON.INLINE.TOOL.CONTROL:"{#TOOL.ALIAS}"}=0
          priority: HIGH
          description: The inline tool is reported down. Depending on the inline-network configuration traffic is bypassed (uninspected) or dropped. Disable per tool with {$GIGAMON.INLINE.TOOL.CONTROL:"<alias>"}=0.
          tags:
          - tag: scope
            value: inline
      - uuid: 0b490e9ff5664f978b0c59194708bd96
        name: 'Inline tool {#TOOL.ALIAS} [{#SNMPINDEX}]: Heartbeat'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.26866.4.1.1.1.7.{#SNMPINDEX}
        key: gigamon.inline.tool.hb[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: UNSIGNED
        description: MIB object intHBStatus (1.3.6.1.4.1.26866.4.1.1.1.7)
        valuemap:
          name: Gigamon inline heartbeat status
        tags:
        - tag: component
          value: inline-bypass
        trigger_prototypes:
        - uuid: 7a5d7b5dfd09489d881376bec9ce42d2
          expression: '{$GIGAMON.INLINE.TOOL.CONTROL:"{#TOOL.ALIAS}"}=1 and last(/Gigamon GigaVUE Inline Bypass by SNMP/gigamon.inline.tool.hb[{#SNMPINDEX}])=1 and last(/Gigamon GigaVUE Inline Bypass by SNMP/gigamon.inline.tool.agg[{#SNMPINDEX}])<>1'
          name: 'Inline tool {#TOOL.ALIAS} [{#SNMPINDEX}]: Heartbeat down'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/Gigamon GigaVUE Inline Bypass by SNMP/gigamon.inline.tool.hb[{#SNMPINDEX}])<>1 or {$GIGAMON.INLINE.TOOL.CONTROL:"{#TOOL.ALIAS}"}=0
          priority: HIGH
          description: Heartbeat lost while the aggregate status is not yet down. Suppressed when the aggregate-down trigger already covers the tool.
          tags:
          - tag: scope
            value: inline
      - uuid: 53198379b9ac4888865f9496fb03ef03
        name: 'Inline tool {#TOOL.ALIAS} [{#SNMPINDEX}]: Negative heartbeat'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.26866.4.1.1.1.9.{#SNMPINDEX}
        key: gigamon.inline.tool.nhb[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: UNSIGNED
        description: MIB object intNegativeHBStatus (1.3.6.1.4.1.26866.4.1.1.1.9)
        valuemap:
          name: Gigamon inline heartbeat status
        tags:
        - tag: component
          value: inline-bypass
        trigger_prototypes:
        - uuid: 9ceb88da725f442f856f5a1cce1a55fe
          expression: '{$GIGAMON.INLINE.TOOL.CONTROL:"{#TOOL.ALIAS}"}=1 and last(/Gigamon GigaVUE Inline Bypass by SNMP/gigamon.inline.tool.nhb[{#SNMPINDEX}])=1'
          name: 'Inline tool {#TOOL.ALIAS} [{#SNMPINDEX}]: Negative heartbeat down'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/Gigamon GigaVUE Inline Bypass by SNMP/gigamon.inline.tool.nhb[{#SNMPINDEX}])<>1 or {$GIGAMON.INLINE.TOOL.CONTROL:"{#TOOL.ALIAS}"}=0
          priority: WARNING
          tags:
          - tag: scope
            value: inline
      - uuid: 707c3b37674a40aa8e298c2598ca35bd
        name: 'Inline tool {#TOOL.ALIAS} [{#SNMPINDEX}]: Port A status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.26866.4.1.1.1.5.{#SNMPINDEX}
        key: gigamon.inline.tool.pa[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: UNSIGNED
