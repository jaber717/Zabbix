zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 61caa47830154f6fa4e51d950586e8d0
    name: Templates/Cisco FMC
  templates:
  - uuid: 1fbc2354d247429f860231523b0b26cc
    template: Cisco FMC by REST API
    name: Cisco FMC by REST API
    description: |-
      Cisco Secure Firewall Management Center (FMC) monitoring through the FMC REST API.
      Zabbix 7.0 or later. One script item polls the API; everything else is dependent items.

      Setup
      1. FMC: System > Configuration > REST API Preferences > Enable REST API.
      2. FMC: create a dedicated internal user for monitoring (read-only / health-capable role).
      3. Zabbix: create a host with any interface whose address (use DNS) matches the FMC HTTPS certificate; the script connects to {HOST.CONN}. Link this template.
      4. Set {$FMC.USERNAME} and {$FMC.PASSWORD} on the host. Use 'Test' on item 'Cisco FMC: Get data' once before enabling the host: a wrong password is retried and can lock the FMC account.
      5. TLS: the script's HTTP client verifies the FMC certificate and has no option to skip verification. Install the FMC (or its issuing CA) certificate in the trust store of the Zabbix server / proxy that polls.

      This template covers what only the API exposes: managed-device health and connection, pending deployments, FMC-side Health Monitor alerts, software and content-package versions. CPU, memory, disk and interface counters of the FMC appliance itself are better taken from SNMP (Linux by SNMP) on the same host.
    groups:
    - name: Templates/Cisco FMC
    items:
    - uuid: ddeb0e8a62f04e9bae826a4e769753bb
      name: 'Cisco FMC: Get data'
      type: SCRIPT
      key: fmc.get
      delay: '{$FMC.POLL.INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      params: |
        // Cisco FMC by REST API - collector for a Zabbix 7.0 script item (Duktape, ES5 only).
        //
        // Input  (JSON in `value`): host, port, user, password, domain, alerts_window, revoke,
        //                           deploy_enabled, alerts_all, max_items
        // Flow   : generatetoken -> devicerecords -> serverversion -> deployabledevices -> health/alerts -> revokeaccess
        //
        // Error policy
        //  - Credential / REST-API-disabled failures are THROWN ("AUTH: ..."). The item goes unsupported and Zabbix
        //    retries at the "unsupported item" interval instead of hammering FMC and locking the service account.
        //  - Every other API call is an independent SECTION. A failing section never stops the others. Its result is
        //    omitted from the JSON (never zero-filled) and its status is published in sections.<name>:
        //    s = 0 ok, 1 error, 2 forbidden (HTTP 403, needs an FMC-side permission change), 3 disabled/not needed;
        //    http = HTTP status of the failure, msg = FMC's own error text, n/pages = records/pages read.
        //    devicerecords failing sets ok=0 + error; the other sections are still collected.
        //  - Pagination never reports a partial list as complete: a page budget, a record budget, an offset-ignored
        //    check and a cross-check against the count reported by FMC all end in an explicit section error.
        //
        // Zabbix limits a script to 10 HttpRequest objects, so ONE instance is reused for every call.

        var P = JSON.parse(value);
        var t_start = Date.now();

        var out = { ok: 0, error: '', warnings: [], sections: {}, timing: { auth: 0, total: 0 } };
        var token = null;
        var refresh = null;
        var fatal = null;
        var http = new HttpRequest();

        var base = 'https://' + P.host + ':' + (P.port ? String(P.port) : '443');
        var DEVICE_PAGE = 100;
        var ALERT_PAGE = 1000;
        var MAX_PAGES = 50;          // per list; with the request budget this stays below FMC's 120 requests/min
        var REQ_BUDGET = 100;        // HTTP calls per poll
        var TIME_BUDGET = 100000;    // ms; the item timeout of the template is 120 s
        var reqs = 0;

        function str(v) {
            return (v === undefined || v === null) ? '' : String(v);
        }

        function num(v, d) {
            var n = parseInt(v, 10);
            return isNaN(n) ? d : n;
        }

        function trunc(s, n) {
            s = str(s);
            return s.length > n ? s.substring(0, n - 3) + '...' : s;
        }

        function errMsg(e) {
            return (e && e.message) ? str(e.message) : str(e);
        }

        var MAX_ITEMS = num(P.max_items, 50000);
        if (MAX_ITEMS < 100) { MAX_ITEMS = 100; }
        if (MAX_ITEMS > 500000) { MAX_ITEMS = 500000; }

        // Typed error: keeps the HTTP status so 403 can be told apart from other failures.
        function fail(what, httpStatus, text) {
            return { message: what + ': ' + text, http: httpStatus };
        }

        function getHeader(headers, name) {
            var lname = name.toLowerCase();
            var k, v;
            if (!headers) {
                return '';
            }
            for (k in headers) {
                if (Object.prototype.hasOwnProperty.call(headers, k) && k.toLowerCase() === lname) {
                    v = headers[k];
                    if (Object.prototype.toString.call(v) === '[object Array]') {
                        v = v[0];
                    }
                    return str(v);
                }
            }
            return '';
        }

        function healthCode(s) {
            s = str(s).toLowerCase();
            if (s === 'green' || s === 'normal' || s === 'recovered') {
                return 0;
            }
            if (s === 'yellow' || s === 'warning') {
                return 1;
            }
            if (s === 'red' || s === 'critical' || s === 'error' || s === 'failed') {
                return 2;
            }
            return 3; // gray / disabled / unknown / anything unexpected
        }

        // FMC error bodies look like {"error":{"messages":[{"description":"Access denied"}]}}
        function apiErrorText(body) {
            var j, m;
            try {
                j = JSON.parse(body);
                m = j.error.messages[0];
                return trunc(m.description || m.details || '', 160);
            } catch (e) {
                return '';
            }
        }

        function call(method, path, withToken) {
            var body;
            http.clearHeader();
            http.addHeader('Accept: application/json');
            http.addHeader('Content-Type: application/json');
            if (withToken && token) {
                http.addHeader('X-auth-access-token: ' + token);
            }
            if (method === 'POST') {
                body = http.post(base + path, '');
            } else {
                body = http.get(base + path);
            }
            return { status: http.getStatus(), body: body, headers: http.getHeaders() };
        }

        function getJson(path, what) {
            var r, detail;
            if (reqs >= REQ_BUDGET) {
                throw fail(what, 0, 'request budget of ' + REQ_BUDGET + ' calls per poll exhausted (FMC allows 120/min per source IP)');
            }
            if (Date.now() - t_start > TIME_BUDGET) {
                throw fail(what, 0, 'collector time budget of ' + Math.round(TIME_BUDGET / 1000) + ' s exhausted');
            }
            reqs++;
            r = call('GET', path, true);
            if (r.status === 429) {
                throw fail(what, 429, 'HTTP 429 (FMC REST API rate limit exceeded)');
            }
            if (r.status !== 200) {
                detail = apiErrorText(r.body);
                throw fail(what, r.status, 'HTTP ' + r.status + (detail ? ' - ' + detail : ''));
            }
            try {
                return JSON.parse(r.body);
            } catch (e) {
                throw fail(what, 200, 'response is not valid JSON');
            }
        }

        // Reads every record of a list resource and hands each one to onItem (nothing is accumulated here).
        //
        // FMC list responses: {"links":..,"items":[..],"paging":{"offset":0,"limit":25,"count":N,"pages":M}}.
        //  - The next offset is advanced by the number of records actually received, not by the requested size, so a
        //    server that clamps `limit` (e.g. 1000 -> 25) is still read completely.
        //  - A page shorter than the effective limit (paging.limit when present) is the last page; an empty page ends
        //    the list. A full last page costs one extra (empty) request, which is cheaper than guessing.
        //  - paging.count is only used as a cross-check, never as the sole stop condition: if the list ends before the
        //    reported count was read, that is an error, not a smaller result.
        //  - Identical first/last records on consecutive pages mean the server ignored `offset`; stop instead of
        //    counting duplicates until a safety cap trips.
        //  - A response without `items` is an empty list only when it carries a `paging` object; otherwise it is an
        //    unexpected shape.
        function pageAll(path, what, want, onItem) {
            var sep = (path.indexOf('?') === -1) ? '?' : '&';
            var offset = 0, pages = 0, fetched = 0, total = -1, eff = want, prevSig = null;
            var j, got, p, c, l, sig, i;
            for (;;) {
                pages++;
                if (pages > MAX_PAGES) {
                    throw fail(what, 0, 'needs more than ' + MAX_PAGES + ' pages (read ' + fetched + ' records, FMC count ' +
                        (total >= 0 ? total : 'n/a') + ', effective page size ' + eff + '); narrow the query rather than raising the cap');
                }
                j = getJson(path + sep + 'limit=' + want + '&offset=' + offset, what);
                p = (j && typeof j.paging === 'object' && j.paging) ? j.paging : null;
                if (j && Object.prototype.toString.call(j.items) === '[object Array]') {
                    got = j.items;
                } else if (p) {
                    got = [];
                } else {
                    throw fail(what, 200, 'expected an items array; unexpected FMC response shape');
                }
                if (p) {
                    c = num(p.count, -1);
                    if (c >= 0) { total = c; }
                    l = num(p.limit, 0);
                    if (l > 0) { eff = l; }
                }
                if (got.length > eff) { eff = got.length; }
                if (total > MAX_ITEMS) {
                    throw fail(what, 0, 'FMC reports ' + total + ' records (page size ' + eff + ', ' + Math.ceil(total / eff) +
                        ' pages), above the limit of ' + MAX_ITEMS + ' ({$FMC.PAGING.MAX.ITEMS}); reduce the query (e.g. {$FMC.ALERTS.WINDOW}) or raise the limit knowingly');
                }
                if (got.length === 0) {
                    break;
                }
                sig = JSON.stringify(got[0]) + '|' + JSON.stringify(got[got.length - 1]) + '|' + got.length;
                if (prevSig !== null && sig === prevSig) {
                    throw fail(what, 0, 'offset ' + offset + ' returned the same records as the previous page (server ignores offset; read ' +
                        fetched + ' records, FMC count ' + (total >= 0 ? total : 'n/a') + '); refusing to count duplicates');
                }
                prevSig = sig;
                for (i = 0; i < got.length; i++) {
                    onItem(got[i]);
                }
                fetched += got.length;
                offset += got.length;
                if (fetched > MAX_ITEMS) {
                    throw fail(what, 0, 'more than ' + MAX_ITEMS + ' records ({$FMC.PAGING.MAX.ITEMS}) read; refusing a partial result');
                }
                if (got.length < eff) {
                    break;
                }
            }
            if (total >= 0 && fetched < total) {
                throw fail(what, 0, 'incomplete list: read ' + fetched + ' of ' + total + ' records reported by FMC in ' + pages + ' pages (page size ' + eff + ')');
            }
            return { n: fetched, count: total, pages: pages, limit: eff };
        }

        // Runs one independent section. Returns '' on success, otherwise the error text (also stored in out.sections).
        function runSection(name, what, hint403, fn) {
            var meta, m, code, h;
            try {
                meta = fn();
                out.sections[name] = { s: 0 };
                if (meta) {
                    out.sections[name].n = meta.n;
                    out.sections[name].pages = meta.pages;
                }
                return '';
            } catch (e) {
                m = errMsg(e);
                if (m.indexOf(what + ':') !== 0) {
                    m = what + ': ' + m;
                }
                h = (e && typeof e.http === 'number') ? e.http : 0;
                code = (h === 403) ? 2 : 1;
                if (code === 2 && hint403) {
                    m += ' [' + hint403 + ']';
                }
                m = trunc(m, 300);
                out.sections[name] = { s: code, http: h, msg: m };
                return m;
            }
        }

        function disabled(name) {
            out.sections[name] = { s: 3 };
        }

        function alertKey(a) {
            return str(a.deviceUUID) + '|' + str(a.moduleID) + '|' + str(a.name);
        }

        // Keep only the newest alert per device+module+name so RED followed by RECOVERED/GREEN cancels out.
        function keepNewest(latest, a, onlyFmc) {
            var key;
            if (onlyFmc && str(a.deviceUUID) !== '0') {
                return;
            }
            key = alertKey(a);
            if (!latest[key] || num(a.timestamp, 0) >= num(latest[key].timestamp, 0)) {
                latest[key] = a;
            }
        }

        function summarize(latest) {
            var res = { fmc: { red: 0, yellow: 0, details: '' }, all: { red: 0, yellow: 0 } };
            var fmcRed = [];
            var fmcYellow = [];
            var key, a, st, line;
            for (key in latest) {
                if (!Object.prototype.hasOwnProperty.call(latest, key)) { continue; }
                a = latest[key];
                st = str(a.status).toUpperCase();
                // Cisco FMC may return CRITICAL/WARNING/NORMAL (as well as RED/YELLOW/GREEN).
                if (st === 'CRITICAL') { st = 'RED'; }
                if (st === 'WARNING') { st = 'YELLOW'; }
                if (st !== 'RED' && st !== 'ERROR' && st !== 'FAILED' && st !== 'YELLOW') { continue; }
                line = st + ' ' + str(a.moduleID) + ': ' + trunc(a.description || a.name || a.details, 120);
                if (st === 'YELLOW') {
                    res.all.yellow++;
                    if (str(a.deviceUUID) === '0') { res.fmc.yellow++; fmcYellow.push(line); }
                } else {
                    res.all.red++;
                    if (str(a.deviceUUID) === '0') { res.fmc.red++; fmcRed.push(line); }
                }
            }
            res.fmc.details = trunc(fmcRed.concat(fmcYellow).join('; '), 1000);
            return res;
        }

        try {
            if (!P.user || !P.password) {
                throw 'AUTH: {$FMC.USERNAME} / {$FMC.PASSWORD} are not set on the host';
            }

            // ---- 1. token -------------------------------------------------------------------------------
            var t0 = Date.now();
            http.clearHeader();
            http.addHeader('Authorization: Basic ' + btoa(P.user + ':' + P.password));
            http.addHeader('Content-Type: application/json');
            http.post(base + '/api/fmc_platform/v1/auth/generatetoken', '');
            var authStatus = http.getStatus();
            var authHeaders = http.getHeaders();
            out.timing.auth = Math.round(Date.now() - t0) / 1000;

            if (authStatus === 401) {
                throw 'AUTH: generatetoken returned HTTP 401 - invalid credentials (item stays unsupported to avoid account lockout)';
            }
            if (authStatus === 403) {
                throw 'AUTH: generatetoken returned HTTP 403 - REST API disabled (System > Configuration > REST API Preferences) or user not permitted';
            }
            if (authStatus === 429) {
                throw 'generatetoken returned HTTP 429 (login throttling / rate limit)';
            }
            if (authStatus !== 200 && authStatus !== 204) {
                throw 'generatetoken returned HTTP ' + authStatus;
            }
            token = getHeader(authHeaders, 'X-auth-access-token');
            refresh = getHeader(authHeaders, 'X-auth-refresh-token');
            if (!token) {
                throw 'generatetoken returned no X-auth-access-token header';
            }
            var domain = P.domain ? str(P.domain) : getHeader(authHeaders, 'DOMAIN_UUID');
            if (!domain) {
                throw 'generatetoken returned no DOMAIN_UUID header and {$FMC.DOMAIN.UUID} is empty';
            }
            out.domain = domain;
            var dpath = '/api/fmc_config/v1/domain/' + domain;

            // ---- 2. managed devices (primary data; a failure sets ok=0 but does not stop the other sections) ----
            var devErr = runSection('devices', 'devicerecords', 'the FMC user needs read access to managed devices', function () {
                var devs = { total: 0, green: 0, yellow: 0, red: 0, other: 0, disconnected: 0, items: [] };
                var meta = pageAll(dpath + '/devices/devicerecords?expanded=true', 'devicerecords', DEVICE_PAGE, function (d) {
                    var hc = healthCode(d.healthStatus);
                    var it = {
                        id: str(d.id),
                        name: str(d.name),
                        host: str(d.hostName),
                        model: str(d.model),
                        ver: str(d.sw_version || d.version),
                        hs: str(d.healthStatus),
                        hc: hc,
                        dep: str(d.deploymentStatus)
                    };
                    // Empty for healthy devices so the message item clears on recovery instead of keeping stale text.
                    it.hm = (hc !== 0) ? trunc(d.healthMessage, 160) : '';
                    if (typeof d.isConnected === 'boolean') {
                        it.con = d.isConnected ? 1 : 0;
                        if (!d.isConnected) {
                            devs.disconnected++;
                        }
                    }
                    devs.total++;
                    if (hc === 0) {
                        devs.green++;
                    } else if (hc === 1) {
                        devs.yellow++;
                    } else if (hc === 2) {
                        devs.red++;
                    } else {
                        devs.other++;
                    }
                    devs.items.push(it);
                });
                out.devices = devs;   // assigned only after the whole list was read
                return meta;
            });
            if (devErr) {
                out.error = trunc(devErr, 500);
            } else {
                out.ok = 1;
            }

            // ---- 3. FMC version (secondary) -----------------------------------------------------------------
            var e1 = runSection('version', 'serverversion', '', function () {
                var vj = getJson('/api/fmc_platform/v1/info/serverversion', 'serverversion');
                var v0 = (vj.items && vj.items[0]) ? vj.items[0] : {};
                var ver = {};
                if (v0.serverVersion) { ver.server = str(v0.serverVersion); }
                if (v0.vdbVersion) { ver.vdb = str(v0.vdbVersion); }
                if (v0.sruVersion) { ver.sru = str(v0.sruVersion); }
                if (v0.geoVersion) { ver.geo = str(v0.geoVersion); }
                if (v0.lspVersion) { ver.lsp = str(v0.lspVersion); }
                out.version = ver;
                return null;
            });
            if (e1) { out.warnings.push(e1); }

            // ---- 4. pending deployments (secondary; needs a role that may view/perform deployments) ------------
            if (P.deploy_enabled === '0') {
                disabled('deploy');
            } else {
                var e2 = runSection('deploy', 'deployabledevices',
                    'FMC user role cannot view deployments - grant a role with deployment access or set {$FMC.DEPLOY.ENABLED}=0', function () {
                    var pend = [];
                    var meta = pageAll(dpath + '/deployment/deployabledevices?expanded=true', 'deployabledevices', DEVICE_PAGE, function (x) {
                        pend.push(str(x.name)); // the resource lists devices with out-of-date config; count them all
                    });
                    out.deploy = { pending: pend.length, devices: trunc(pend.join(', '), 500) };
                    return meta;
                });
                if (e2) { out.warnings.push(e2); }
            }

            // ---- 5. health alerts (secondary; two independent sections) --------------------------------------------
            var win = num(P.alerts_window, 86400);
            if (win <= 0) {
                disabled('alerts_all');
                disabled('alerts_fmc');
            } else {
                if (win < 300) { win = 300; }
                if (win > 604800) { win = 604800; }
                var now = Math.floor(Date.now() / 1000);
                // +600s on endTime so a few minutes of clock skew between Zabbix and FMC cannot hide fresh alerts
                var flt = 'startTime:' + (now - win) + ';endTime:' + (now + 600);
                var apath = dpath + '/health/alerts?expanded=true&filter=';
                var h403 = 'FMC user lacks the Health permission - grant a role that may view Health Monitor alerts';
                var allOk = false;
                var res = null;

                if (P.alerts_all === '0') {
                    disabled('alerts_all');
                } else {
                    var latestAll = {};
                    var e3 = runSection('alerts_all', 'health/alerts[all]', h403, function () {
                        var meta = pageAll(apath + encodeURIComponent(flt), 'health/alerts[all]', ALERT_PAGE, function (a) {
                            keepNewest(latestAll, a, false);
                        });
                        res = summarize(latestAll);
                        out.alerts = { window: win, fmc: res.fmc, all: res.all };
                        // The FMC-only view is a subset of the all-devices list that was just read completely.
                        out.sections.alerts_fmc = { s: 0, n: meta.n, pages: meta.pages, from: 'alerts_all' };
                        allOk = true;
                        return meta;
                    });
                    if (e3) { out.warnings.push(e3); }
                }

                if (!allOk) {
                    // Narrow, cheap query for the FMC appliance only (deviceUUID 0). Used when the all-devices list is
                    // disabled or failed (typically: too many records), so the FMC's own health stays monitored.
                    var latestFmc = {};
                    var e4 = runSection('alerts_fmc', 'health/alerts[fmc]', h403, function () {
                        var meta = pageAll(apath + encodeURIComponent(flt + ';deviceUUIDs:0'), 'health/alerts[fmc]', ALERT_PAGE, function (a) {
                            keepNewest(latestFmc, a, true);   // client-side check as well, in case the filter is not honoured
                        });
                        res = summarize(latestFmc);
                        out.alerts = { window: win, fmc: res.fmc };   // no "all" block: it was not collected
                        return meta;
                    });
                    if (e4) { out.warnings.push(e4); }
                }
            }
        } catch (e) {
            var msg = errMsg(e);
            out.ok = 0;
            out.error = trunc(msg, 500);
            if (msg.indexOf('AUTH:') === 0) {
                fatal = msg;
            }
        } finally {
            // Release the FMC session; never let a failure here affect the result.
            if (token && P.revoke !== '0') {
                try {
                    http.clearHeader();
                    http.addHeader('X-auth-access-token: ' + token);
                    if (refresh) {
                        http.addHeader('X-auth-refresh-token: ' + refresh);
                    }
                    http.post(base + '/api/fmc_platform/v1/auth/revokeaccess', '');
                } catch (e9) {
                    Zabbix.log(4, 'FMC: revokeaccess failed: ' + errMsg(e9));
                }
            }
        }

        if (fatal) {
            throw fatal;
        }

        out.timing.total = Math.round(Date.now() - t_start) / 1000;
        out.requests = reqs;

        // Text item values are capped at 64 KB. Shed per-device detail before hitting it so the item never goes unsupported.
        var json = JSON.stringify(out);
        if (json.length > 60000 && out.devices && out.devices.items) {
            var n;
            for (n = 0; n < out.devices.items.length; n++) {
                delete out.devices.items[n].hm;
                delete out.devices.items[n].host;
                delete out.devices.items[n].model;
            }
            out.warnings.push('output exceeded 60 KB; per-device host/model/health message were dropped');
            json = JSON.stringify(out);
        }
        return json;
      description: 'Single collector for the whole template. Logs in once (generatetoken), reads managed devices, server version, pending deployments and health alerts, then revokes the session. Every API call is an independent section: a failing section is omitted from the JSON (never zero-filled), reported in sections.<name> and in the warnings, and does not stop the other sections. Lists are read with server-reported paging metadata and are never published partially. Every other item is a dependent item that parses this JSON. If this item is Not supported, read its error text: AUTH errors are thrown on purpose so a wrong password is not retried at the normal poll rate.'
      timeout: 120s
      parameters:
      - name: host
        value: '{HOST.CONN}'
      - name: port
        value: '{$FMC.PORT}'
      - name: user
        value: '{$FMC.USERNAME}'
      - name: password
        value: '{$FMC.PASSWORD}'
      - name: domain
        value: '{$FMC.DOMAIN.UUID}'
      - name: alerts_window
        value: '{$FMC.ALERTS.WINDOW}'
      - name: revoke
        value: '{$FMC.REVOKE}'
      - name: deploy_enabled
        value: '{$FMC.DEPLOY.ENABLED}'
      - name: alerts_all
        value: '{$FMC.ALERTS.ALL.ENABLED}'
      - name: max_items
        value: '{$FMC.PAGING.MAX.ITEMS}'
      tags:
      - tag: component
        value: raw
    - uuid: 5a7d97bb22484f159532ead28ff2b3c6
      name: 'Cisco FMC: API available'
      type: DEPENDENT
      key: fmc.available
      delay: '0'
      history: 31d
      value_type: UNSIGNED
      trends: 365d
      description: 1 when authentication and the managed-device query succeeded in the last poll.
      valuemap:
        name: Cisco FMC API availability
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.ok
      master_item:
        key: fmc.get
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: bb6ff894de1c45e98c2b81a1ac5a4861
        expression: last(/Cisco FMC by REST API/fmc.available)=0 and length(last(/Cisco FMC by REST API/fmc.error))>0
        name: 'Cisco FMC: REST API is not usable ({ITEM.LASTVALUE2})'
        priority: HIGH
