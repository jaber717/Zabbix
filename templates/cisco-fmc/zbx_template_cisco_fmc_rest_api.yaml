    discovery_rules:
    - uuid: 06bbd23801c948d39566fda1c6e2205e
      name: Managed devices discovery
      type: DEPENDENT
      key: fmc.devices.discovery
      delay: '0'
      lifetime: 7d
      description: One entry per device record on the FMC. Filter with {$FMC.DEVICES.NAME.MATCHES} / {$FMC.DEVICES.NAME.NOT_MATCHES}. A poll that fails keeps the previous discovery result.
      item_prototypes:
      - uuid: 3213babb963d446b9a6f2f4c31320d05
        name: 'Device [{#DEVICE.NAME}]: Health status'
        type: DEPENDENT
        key: fmc.device.health[{#DEVICE.ID}]
        delay: '0'
        history: 31d
        value_type: UNSIGNED
        trends: 365d
        description: 'FMC healthStatus of the managed device: green / yellow / red; anything else is Unknown.'
        valuemap:
          name: Cisco FMC health status
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.devices.items[?(@.id=='{#DEVICE.ID}')].hc.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: fmc.get
        tags:
        - tag: component
          value: health
        trigger_prototypes:
        - uuid: 406c2844a91040a5a994103b106e3119
          expression: last(/Cisco FMC by REST API/fmc.device.health[{#DEVICE.ID}])=2
          name: 'Cisco FMC: Device {#DEVICE.NAME} health is red'
          priority: HIGH
          description: Managed device ({#DEVICE.HOST}, {#DEVICE.MODEL}) reports RED health in FMC. See the "Health message" item of this device for the reason.
          tags:
          - tag: scope
            value: health
          - tag: device
            value: '{#DEVICE.NAME}'
        - uuid: b7984420b4d5499993f9eb1dc036cd30
          expression: last(/Cisco FMC by REST API/fmc.device.health[{#DEVICE.ID}])=1
          name: 'Cisco FMC: Device {#DEVICE.NAME} health is yellow'
          priority: WARNING
          tags:
          - tag: scope
            value: health
          - tag: device
            value: '{#DEVICE.NAME}'
        - uuid: adaccea1919942d29e6d9c20cc1f9295
          expression: min(/Cisco FMC by REST API/fmc.device.health[{#DEVICE.ID}],#6)=3
          name: 'Cisco FMC: Device {#DEVICE.NAME} health is unknown or disabled'
          priority: INFO
          description: healthStatus has been gray/disabled/unrecognised for 6 consecutive polls. A health policy with the modules disabled produces this.
          tags:
          - tag: scope
            value: health
          - tag: device
            value: '{#DEVICE.NAME}'
      - uuid: e2bd4da648d6400db455795877ee30a5
        name: 'Device [{#DEVICE.NAME}]: Health message'
        type: DEPENDENT
        key: fmc.device.health.msg[{#DEVICE.ID}]
        delay: '0'
        history: 31d
        value_type: TEXT
        trends: '0'
        description: healthMessage from the device record; empty while the device is green.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.devices.items[?(@.id=='{#DEVICE.ID}')].hm.first()
          error_handler: DISCARD_VALUE
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 12h
        master_item:
          key: fmc.get
        tags:
        - tag: component
          value: health
      - uuid: e3fe376da9bc49f99d18e0a5849a5876
        name: 'Device [{#DEVICE.NAME}]: Connection to FMC'
        type: DEPENDENT
        key: fmc.device.connected[{#DEVICE.ID}]
        delay: '0'
        history: 31d
        value_type: UNSIGNED
        trends: 365d
        description: isConnected flag of the device record.
        valuemap:
          name: Cisco FMC device connection
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.devices.items[?(@.id=='{#DEVICE.ID}')].con.first()
          error_handler: DISCARD_VALUE
        master_item:
          key: fmc.get
        tags:
        - tag: component
          value: health
        trigger_prototypes:
        - uuid: 1d866a02a7fc4d5abe08791f2fb00855
          expression: last(/Cisco FMC by REST API/fmc.device.connected[{#DEVICE.ID}])=0
          name: 'Cisco FMC: Device {#DEVICE.NAME} is disconnected from FMC'
          priority: HIGH
          tags:
          - tag: scope
            value: availability
          - tag: device
            value: '{#DEVICE.NAME}'
      - uuid: 419b649389854e6aa6db66f0b8e27d1b
        name: 'Device [{#DEVICE.NAME}]: Software version'
        type: DEPENDENT
        key: fmc.device.version[{#DEVICE.ID}]
        delay: '0'
        history: 31d
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.devices.items[?(@.id=='{#DEVICE.ID}')].ver.first()
          error_handler: DISCARD_VALUE
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 12h
        master_item:
          key: fmc.get
        tags:
        - tag: component
          value: inventory
        trigger_prototypes:
        - uuid: a4e5e8e919d94f3386fc846ca07efb21
          expression: change(/Cisco FMC by REST API/fmc.device.version[{#DEVICE.ID}])=1
          name: 'Cisco FMC: Device {#DEVICE.NAME} software version changed ({ITEM.LASTVALUE1})'
          priority: INFO
          manual_close: 'YES'
          tags:
          - tag: scope
            value: inventory
          - tag: device
            value: '{#DEVICE.NAME}'
      - uuid: 796a77d9a12f4bb2b5e96ee8c6907999
        name: 'Device [{#DEVICE.NAME}]: Model'
        type: DEPENDENT
        key: fmc.device.model[{#DEVICE.ID}]
        delay: '0'
        history: 31d
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.devices.items[?(@.id=='{#DEVICE.ID}')].model.first()
          error_handler: DISCARD_VALUE
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 12h
        master_item:
          key: fmc.get
        tags:
        - tag: component
          value: inventory
      - uuid: 7d78a980ba7d47aca5f98582d5570f61
        name: 'Device [{#DEVICE.NAME}]: Deployment status'
        type: DEPENDENT
        key: fmc.device.deploy[{#DEVICE.ID}]
        delay: '0'
        history: 31d
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.devices.items[?(@.id=='{#DEVICE.ID}')].dep.first()
          error_handler: DISCARD_VALUE
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 12h
        master_item:
          key: fmc.get
        tags:
        - tag: component
          value: deployment
      master_item:
        key: fmc.get
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.devices.items
        error_handler: DISCARD_VALUE
      lld_macro_paths:
      - lld_macro: '{#DEVICE.ID}'
        path: $.id
      - lld_macro: '{#DEVICE.NAME}'
        path: $.name
      - lld_macro: '{#DEVICE.HOST}'
        path: $.host
      - lld_macro: '{#DEVICE.MODEL}'
        path: $.model
      filter:
        evaltype: AND
        conditions:
        - macro: '{#DEVICE.NAME}'
          value: '{$FMC.DEVICES.NAME.MATCHES}'
          formulaid: A
        - macro: '{#DEVICE.NAME}'
          operator: NOT_MATCHES_REGEX
          value: '{$FMC.DEVICES.NAME.NOT_MATCHES}'
          formulaid: B
    macros:
    - macro: '{$FMC.USERNAME}'
      description: FMC user with REST API access (dedicated, read-only/monitoring role).
    - macro: '{$FMC.PASSWORD}'
      type: SECRET_TEXT
      description: Password of {$FMC.USERNAME}.
    - macro: '{$FMC.PORT}'
      value: '443'
      description: HTTPS port of the FMC.
    - macro: '{$FMC.DOMAIN.UUID}'
      description: Leave empty to use the DOMAIN_UUID returned at login (the user's default / Global domain). Set it to poll another domain.
    - macro: '{$FMC.POLL.INTERVAL}'
      value: 5m
      description: Collector interval. Each run is one login plus about 5-8 API calls, more when lists span several pages (a hard budget of 100 calls per run protects the 120 calls/min limit).
    - macro: '{$FMC.ALERTS.WINDOW}'
      value: '86400'
      description: Health-alert look-back in seconds (300-604800). 0 disables the health-alert calls. A shorter window means fewer records per poll; on busy systems prefer a few hours over 24 h.
    - macro: '{$FMC.DEPLOY.ENABLED}'
      value: '1'
      description: '1 = read deployment/deployabledevices (pending deployments). Needs an FMC role that may view deployments (e.g. Administrator, Network Admin or Security Approver; read-only analyst roles get HTTP 403). Set 0 to skip the call when the monitoring user must stay read-only; the pending-deployment items then stop updating.'
    - macro: '{$FMC.ALERTS.ALL.ENABLED}'
      value: '1'
      description: '1 = also read health alerts for all managed devices. 0 = only the FMC appliance itself (deviceUUID 0), a much smaller query. If the all-devices list fails or is too large the template falls back to the FMC-only query automatically.'
    - macro: '{$FMC.PAGING.MAX.ITEMS}'
      value: '50000'
      description: 'Upper bound of records read from one FMC list per poll (100-500000). A list reported larger than this is refused with an explicit error instead of being truncated; reduce {$FMC.ALERTS.WINDOW} first.'
    - macro: '{$FMC.REVOKE}'
      value: '1'
      description: 1 = revoke the API token at the end of every run. Set 0 only if revokeaccess is rejected on your version.
    - macro: '{$FMC.NODATA.TIMEOUT}'
      value: 15m
      description: No-data period for the collector. Keep it above 2x {$FMC.POLL.INTERVAL}.
    - macro: '{$FMC.POLL.TIME.WARN}'
      value: '30'
      description: Seconds; slow-collection threshold.
    - macro: '{$FMC.DEPLOY.PENDING.TIME}'
      value: 24h
      description: How long changes may stay undeployed before the INFO trigger fires.
    - macro: '{$FMC.DEVICES.NAME.MATCHES}'
      value: .*
      description: 'Regex: managed devices to discover.'
    - macro: '{$FMC.DEVICES.NAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: 'Regex: managed devices to exclude from discovery.'
    tags:
    - tag: class
      value: software
    - tag: target
      value: cisco-fmc
    valuemaps:
    - uuid: f806dacdbd8342bfb54f7ba19d3b30ca
      name: Cisco FMC API availability
      mappings:
      - value: '0'
        newvalue: Failed
      - value: '1'
        newvalue: OK
    - uuid: 5c8ddd4e407447bfbf2a42141d4763c9
      name: Cisco FMC health status
      mappings:
      - value: '0'
        newvalue: Green
      - value: '1'
        newvalue: Yellow
      - value: '2'
        newvalue: Red
      - value: '3'
        newvalue: Unknown / disabled
    - uuid: 238d793c2eed42509726d8399451134c
      name: Cisco FMC device connection
      mappings:
      - value: '0'
        newvalue: Disconnected
      - value: '1'
        newvalue: Connected
    - uuid: 6b7d517d1154406180eecddc73540ea6
      name: Cisco FMC collector section status
      mappings:
      - value: '0'
        newvalue: OK
      - value: '1'
        newvalue: Error
      - value: '2'
        newvalue: Forbidden (HTTP 403)
      - value: '3'
        newvalue: Disabled / not needed
