        description: 'The master item "Cisco FMC: Get data" is Not supported or timing out. Open Latest data on the host and read that item''s error. Typical causes: wrong credentials ("AUTH: ..." - fix them quickly, repeated bad logins can lock the FMC user), REST API disabled, script timeout.'
