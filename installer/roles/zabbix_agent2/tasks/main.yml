---
- name: Validate Agent 2 network inputs
  ansible.builtin.assert:
    that:
      - zabbix_agent_allowed_servers | length > 0
      - zabbix_agent_active_servers | length > 0
      - zabbix_agent_listen_port | int >= 1
      - zabbix_agent_listen_port | int <= 65535

- name: Install Zabbix Agent 2 and diagnostic clients offline
  ansible.builtin.dnf:
    name: "{{ zabbix_agent2_packages }}"
    state: present
    disablerepo: "*"
    enablerepo: "{{ offline_repo_id }}"
    install_weak_deps: false

- name: Configure Zabbix Agent 2
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: zabbix
    mode: "0640"
  notify:
    - Validate Zabbix Agent 2 configuration
    - Restart Zabbix Agent 2

- name: Enable and start Zabbix Agent 2
  ansible.builtin.systemd:
    name: zabbix-agent2.service
    enabled: true
    state: started
  when: not ansible_check_mode
