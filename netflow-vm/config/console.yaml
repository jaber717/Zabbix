http:
  listen: 0.0.0.0:8080
clickhouse:
  servers:
    - http://clickhouse:8123
  database: akvorado
  username: default
  password-file: /run/secrets/ch_default_password
auth:
  # Replaced by local nginx HTTP basic. The console itself trusts the proxy
  # for user identification via the `X-Remote-User` header.
  type: proxy
  header: X-Remote-User
