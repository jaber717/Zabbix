# Akvorado inlet config.
# Flow sources: NetFlow v9 / IPFIX / sFlow. Sampling preserved from exporters.
# All exporters authenticated by source IP via firewalld — no per-exporter secret here.
http:
  listen: 0.0.0.0:8080
kafka:
  topic: akvorado-flows
  brokers:
    - kafka:9092
  version: 3.0.0
flow:
  inputs:
    - type: udp
      decoder: netflow
      listen: 0.0.0.0:2055
      queue-size: 100000
      workers: 2
  rawflows:
    ttl: 14d           # ClickHouse TTL for raw flows
geoip:
  # Add paths to downloaded MaxMind DBs here if licensed.
  asn-database: ""
  geo-database: ""
core:
  exporter-classifiers: []
  interface-classifiers:
    - 'Interface.VLAN = ClassifyRegex(Interface.Description, "VLAN(\\d+)", "$1")'
  default-sampling-rate: 1000
