http:
  listen: 0.0.0.0:8080
kafka:
  topic: akvorado-flows
  brokers:
    - kafka:9092
  version: 3.0.0
  consumer-group: akvorado-outlet
clickhouse:
  servers:
    - http://clickhouse:8123
  database: akvorado
  username: default
  password-file: /run/secrets/ch_default_password
  max-partitions: 50
