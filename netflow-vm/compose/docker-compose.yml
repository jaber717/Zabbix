# Akvorado flow platform — CURRENT architecture (Kafka KRaft, no Zookeeper).
#
# Pinning policy: tags are the current stable Akvorado + Kafka + ClickHouse
# release lineage. Digests are captured on first pull into .digests.lock by
# bin/pin-digests.sh and this file is edited to use the `@sha256:...` form
# thereafter. Do NOT use `:latest` for any of these services.
#
# Verify current Akvorado release before deployment: see release notes at
#   https://github.com/akvorado/akvorado/releases
# This file pins AKVORADO_IMAGE as a variable so Codex can bump without diff.
#
# Expose policy:
# - UDP/2055 (inlet) exposed on 0.0.0.0; firewalld restricts to EXPORTER_CIDRS.
# - All other service ports are bound to 127.0.0.1 ONLY. Cross-VM access
#   (Zabbix -> ClickHouse) runs via the local flow-api gateway (nginx+PHP) over
#   HTTPS; see ../flow-api/.
services:

  kafka:
    image: ${KAFKA_IMAGE:-docker.io/confluentinc/cp-kafka:7.7.1}
    container_name: akvorado-kafka
    # KRaft mode — no Zookeeper. Single broker lab config.
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-akvorado-lab-cluster-01}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx1024M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"   # loopback only; akvorado services reach it inside the compose network
    networks: [akvorado]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-docker.io/clickhouse/clickhouse-server:25.3.3.42}
    container_name: akvorado-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/ch_default_password
      CLICKHOUSE_DB: akvorado
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - /var/lib/akvorado/data/clickhouse:/var/lib/clickhouse:z
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro,z
    ports:
      - "127.0.0.1:8123:8123"   # loopback only — flow-api gateway is the only reader
      - "127.0.0.1:9000:9000"
    secrets: [ch_default_password]
    networks: [akvorado]
    restart: unless-stopped
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      retries: 20

  akvorado-inlet:
    image: ${AKVORADO_IMAGE:-ghcr.io/akvorado/akvorado:2026.10.0}
    container_name: akvorado-inlet
    command: ["inlet", "/etc/akvorado/inlet.yaml"]
    depends_on:
      kafka: {condition: service_healthy}
    volumes:
      - ../config/inlet.yaml:/etc/akvorado/inlet.yaml:ro,z
    ports:
      - "0.0.0.0:2055:2055/udp"   # exporter ingress; firewalld filters sources
    networks: [akvorado]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v0/healthcheck"]
      interval: 15s
      retries: 10

  akvorado-outlet:
    image: ${AKVORADO_IMAGE:-ghcr.io/akvorado/akvorado:2026.10.0}
    container_name: akvorado-outlet
    command: ["outlet", "/etc/akvorado/outlet.yaml"]
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    volumes:
      - ../config/outlet.yaml:/etc/akvorado/outlet.yaml:ro,z
    networks: [akvorado]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v0/healthcheck"]
      interval: 15s
      retries: 10

  akvorado-console:
    image: ${AKVORADO_IMAGE:-ghcr.io/akvorado/akvorado:2026.10.0}
    container_name: akvorado-console
    command: ["console", "/etc/akvorado/console.yaml"]
    depends_on:
      clickhouse: {condition: service_healthy}
    volumes:
      - ../config/console.yaml:/etc/akvorado/console.yaml:ro,z
    ports:
      - "127.0.0.1:8081:8080"   # local nginx TLS-fronts this
    networks: [akvorado]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v0/healthcheck"]
      interval: 15s
      retries: 10

networks:
  akvorado: {}

volumes:
  kafka-data: {}

secrets:
  ch_default_password:
    file: /etc/akvorado/clickhouse-default-password
