# flow-api nginx — TLS front for the Flow query gateway.
# TLS cert is either the internal CA cert (preferred) or self-signed; see
# flow-api-install.sh. firewalld restricts TCP/443 to the Zabbix server IP.
server {
    listen 443 ssl http2;
    server_name netflow-01;

    ssl_certificate     /etc/flow-api/tls/server.crt;
    ssl_certificate_key /etc/flow-api/tls/server.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Never log the Authorization header or the request body.
    log_format redacted '$remote_addr - - [$time_local] "$request" '
                        '$status $body_bytes_sent "-" "$http_user_agent"';
    access_log /var/log/nginx/flow-api.access.log redacted;

    # Bounded concurrency per client IP.
    limit_conn_zone $binary_remote_addr zone=flowapi_conn:4m;
    limit_req_zone  $binary_remote_addr zone=flowapi_req:4m rate=20r/s;

    client_body_buffer_size 32k;
    client_max_body_size 32k;

    location = /healthz {
        proxy_pass http://127.0.0.1:9091/healthz;
    }

    location /api/v1/ {
        limit_conn flowapi_conn 8;
        limit_req  zone=flowapi_req burst=10 nodelay;

        proxy_pass http://127.0.0.1:9091/api/v1/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }

    location / { return 404; }
}
