# flow-api nginx — single TLS front for netflow-01.
# Two separate concerns on the same vhost:
#   /api/v1/      → PHP-FPM Flow API (used by Zabbix FlowSearch module)
#   /akvorado/    → Akvorado console (reverse proxy to loopback-only Traefik)
#   /healthz      → gateway liveness
#
# firewalld restricts :443 to the Zabbix-server IP + NOC mgmt CIDRs; the
# Akvorado console is therefore NEVER exposed outside the management network.
# PHP-FPM listens on 127.0.0.1:9091; Akvorado public Traefik entrypoint is
# bound to 127.0.0.1:8081 by our overlay.

limit_conn_zone $binary_remote_addr zone=flowapi_conn:4m;
limit_req_zone  $binary_remote_addr zone=flowapi_req:4m rate=20r/s;

log_format flowapi_redacted '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/flow-api/tls/server.crt;
    ssl_certificate_key /etc/flow-api/tls/server.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/flow-api.access.log flowapi_redacted;

    # Default: 404. Everything useful is under a specific location.
    location / { return 404; }

    # Flow API gateway liveness (used by stack-up.sh validate step).
    location = /healthz {
        proxy_pass http://127.0.0.1:9091/healthz;
        proxy_set_header Host $host;
    }

    # Flow API — bounded, read-only, Bearer-authed. 32 kB body cap matches the
    # cap on api.php so a client can't negotiate a bigger body.
    location /api/v1/ {
        limit_conn flowapi_conn 8;
        limit_req  zone=flowapi_req burst=10 nodelay;
        client_body_buffer_size 32k;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:9091/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }

    # Akvorado console reverse proxy.
    #   https://netflow-01/akvorado/           → loopback Traefik → akvorado-console
    #   https://netflow-01/akvorado/api/v0/... → same route; Traefik strips.
    # HTTP basic auth lives here, in nginx. The console's upstream Traefik
    # middleware "console-auth" that uses hard-coded "alfred" headers is
    # overridden by our overlay-provided Remote-User header below.
    location /akvorado/ {
        auth_basic           "NetOps Akvorado";
        auth_basic_user_file /etc/flow-api/console-htpasswd;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Hand nginx-authenticated identity to Akvorado's console-auth
        # middleware. Must match the Remote-User header Traefik's labels set
        # (upstream default is "alfred"; our overlay rewrites to $remote_user).
        proxy_set_header Remote-User       $remote_user;
        proxy_set_header Remote-Name       $remote_user;
        proxy_set_header Remote-Email      "$remote_user@netops.local";

        # Strip the /akvorado prefix so Traefik's router (`!PathPrefix(/debug)`)
        # matches cleanly. Traefik is on the loopback-only PUBLIC entrypoint
        # (8081), rebound by overlay/docker-compose.netops.yml.
        rewrite ^/akvorado/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;

        proxy_read_timeout 60s;
        proxy_connect_timeout 2s;
        proxy_buffering off;    # UI streams server-sent events in places
    }

    # Explicit: /clickhouse is deliberately NOT proxied.
    # The private Traefik entrypoint carries /clickhouse but we never surface
    # it outside the host; see overlay/docker-compose.netops.yml traefik ports.
}
