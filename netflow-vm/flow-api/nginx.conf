# flow-api nginx — TLS front for netflow-01.
# /api/v1/* and /healthz are served by PHP-FPM via FastCGI (NOT HTTP proxy;
# PHP-FPM speaks the FastCGI protocol, not HTTP, over 127.0.0.1:9091).
# /akvorado/ is reverse-proxied over HTTP to the loopback-only Traefik public
# entrypoint (127.0.0.1:8081, pinned by overlay/docker-compose.netops.yml).
# /clickhouse is deliberately NOT proxied.

limit_conn_zone $binary_remote_addr zone=flowapi_conn:4m;
limit_req_zone  $binary_remote_addr zone=flowapi_req:4m rate=20r/s;

log_format flowapi_redacted '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/flow-api/tls/server.crt;
    ssl_certificate_key /etc/flow-api/tls/server.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/flow-api.access.log flowapi_redacted;

    client_body_buffer_size 32k;
    client_max_body_size 32k;

    # Default: 404 — only the specific locations below are allowed.
    location / { return 404; }

    # Flow API gateway liveness (used by bin/stack-up.sh validate step).
    location = /healthz {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9091;
        fastcgi_param SCRIPT_FILENAME /var/www/flow-api/api.php;
        fastcgi_param DOCUMENT_URI    /healthz;
        fastcgi_param PATH_INFO       /healthz;
        fastcgi_read_timeout 5s;
    }

    # Flow API — strictly the three operations api.php supports. The URI's
    # last segment is handed to api.php as PATH_INFO so basename($PATH_INFO)
    # resolves to search|summary|topn. Bearer token must be present.
    location ~ ^/api/v1/(search|summary|topn)$ {
        limit_conn flowapi_conn 8;
        limit_req  zone=flowapi_req burst=10 nodelay;

        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9091;
        fastcgi_param SCRIPT_FILENAME /var/www/flow-api/api.php;
        fastcgi_param DOCUMENT_URI    /$1;
        fastcgi_param PATH_INFO       /$1;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 15s;
    }

    # Any other /api/v1/* path is a client bug — return 404 fast rather than
    # letting api.php's error handler decide.
    location /api/v1/ { return 404; }

    # Akvorado console reverse proxy.
    # NOTE: Upstream applies a Traefik `console-auth` middleware that STATICALLY
    # sets Remote-User/Remote-Name/Remote-Email to "alfred". Our overlay
    # removes that middleware so the console sees the headers we set here.
    # If a future upstream change reintroduces it unconditionally, the console
    # will see a service identity, not a per-user one; that's documented in
    # docs/CODEX-NETFLOW-DEPLOY.md.
    location /akvorado/ {
        auth_basic           "NetOps Akvorado";
        auth_basic_user_file /etc/flow-api/console-htpasswd;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User       $remote_user;
        proxy_set_header Remote-Name       $remote_user;
        proxy_set_header Remote-Email      "$remote_user@netops.local";

        rewrite ^/akvorado/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;

        proxy_read_timeout 60s;
        proxy_connect_timeout 2s;
        proxy_buffering off;
    }
}
