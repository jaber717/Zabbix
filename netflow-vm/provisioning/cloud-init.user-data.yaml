#cloud-config
# cloud-init for netflow-01. Does ONLY host preparation (no repo scripts, no
# stack bring-up). The repo tree is rsynced in afterwards by
# create-netflow-proxmox.sh and bin/stack-up.sh is invoked there.
#
# This file deliberately does not reference /opt/akvorado/* in runcmd —
# cloud-init runs before the repo tree exists, so any such reference would
# race-fail on first boot.

hostname: ${NETFLOW_HOSTNAME}
preserve_hostname: false
users:
  - name: netflow-admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${NETOPS_ADMIN_PUBKEY}
      - ${BOOT_PUBKEY}
disable_root: true
ssh_pwauth: false

package_update: true
packages:
  - dnf-plugins-core
  - firewalld
  - lvm2
  - xfsprogs
  - jq
  - python3
  - rsync
  - zabbix-agent2
  - qemu-guest-agent
  - httpd-tools      # htpasswd, used later by bin/stack-up.sh
  - nginx            # installed early so SELinux boolean has a target to allow
  - php-fpm
  - php-cli
  - php-json
  - php-curl
  - openssl

write_files:
  - path: /etc/akvorado/netops.env
    permissions: '0640'
    owner: root:root
    content: |
      NETFLOW_HOSTNAME=${NETFLOW_HOSTNAME}
      ZABBIX_SERVER_IP=${ZABBIX_SERVER_IP}
      EXPORTER_CIDRS=${EXPORTER_CIDRS}
      NOC_MGMT_CIDRS=${NOC_MGMT_CIDRS}
      AKVORADO_VERSION=2026.10.0

runcmd:
  # 1. Dedicated flow data LV on /dev/sdb → /var/lib/akvorado/data.
  - [ bash, -lc, 'if [ -b /dev/sdb ] && ! vgs vg_flow >/dev/null 2>&1; then
        pvcreate -ff -y /dev/sdb &&
        vgcreate vg_flow /dev/sdb &&
        lvcreate -l 100%FREE -n lv_flows vg_flow &&
        mkfs.xfs /dev/vg_flow/lv_flows &&
        mkdir -p /var/lib/akvorado/data/{clickhouse,kafka} &&
        echo "/dev/vg_flow/lv_flows /var/lib/akvorado/data xfs defaults 0 0" >> /etc/fstab &&
        mount -a &&
        chcon -R -t container_file_t /var/lib/akvorado/data; fi' ]

  # 2. Docker Engine + Compose plugin.
  - [ dnf, config-manager, --add-repo, https://download.docker.com/linux/rhel/docker-ce.repo ]
  - [ dnf, install, -y, docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin ]
  - [ systemctl, enable, --now, docker ]

  # 3. qemu-guest-agent for the Proxmox provisioning handshake.
  - [ systemctl, enable, --now, qemu-guest-agent ]

  # 4. firewalld baseline + SELinux booleans. The exporter / NOC / Zabbix
  #    source CIDRs are applied later by the real firewalld-apply.sh once the
  #    repo tree is on disk.
  - [ systemctl, enable, --now, firewalld ]
  - [ setsebool, -P, container_manage_cgroup, "on" ]
  - [ setsebool, -P, httpd_can_network_connect, "on" ]
  - [ systemctl, enable, --now, zabbix-agent2 ]
  - [ bash, -lc, 'echo "cloud-init-host-prep-done" > /var/log/netflow-cloud-init.done' ]
