#cloud-config
# cloud-init for netflow-01 running the OFFICIAL Akvorado v2026.10.0 stack.
# Runtime: Docker Engine + Docker Compose plugin (upstream compose mounts
# /var/run/docker.sock for Traefik's Docker provider — we match that).
# SELinux stays Enforcing. firewalld stays active.
#
# This file never embeds stack logic; it installs the canonical scripts from
# netflow-vm/bin/ and runs bin/stack-up.sh, which is the single supported
# bring-up path.

hostname: ${NETFLOW_HOSTNAME}
preserve_hostname: false
users:
  - name: netflow-admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${NETOPS_ADMIN_PUBKEY}
disable_root: true
ssh_pwauth: false

package_update: true
packages:
  - dnf-plugins-core
  - firewalld
  - lvm2
  - xfsprogs
  - jq
  - python3
  - rsync
  - zabbix-agent2

write_files:
  # Codex ships netflow-vm/ as /opt/akvorado on the target host via
  # provisioning/sync-tree.sh or by rsync from the controller. The vendored
  # upstream, overlay, bin/, flow-api/, and sql/ all land at /opt/akvorado/.

  # NetOps provisioning parameters surfaced to the orchestrator:
  - path: /etc/akvorado/netops.env
    permissions: '0640'
    owner: root:root
    content: |
      NETFLOW_HOSTNAME=${NETFLOW_HOSTNAME}
      ZABBIX_SERVER_IP=${ZABBIX_SERVER_IP}
      EXPORTER_CIDRS=${EXPORTER_CIDRS}
      NOC_MGMT_CIDRS=${NOC_MGMT_CIDRS}
      AKVORADO_VERSION=2026.10.0

runcmd:
  # 1. Dedicated flow data LV on /dev/sdb → /var/lib/akvorado/data (xfs, LVM).
  - [ bash, -lc, 'if [ -b /dev/sdb ] && ! vgs vg_flow >/dev/null 2>&1; then
        pvcreate -ff -y /dev/sdb &&
        vgcreate vg_flow /dev/sdb &&
        lvcreate -l 100%FREE -n lv_flows vg_flow &&
        mkfs.xfs /dev/vg_flow/lv_flows &&
        mkdir -p /var/lib/akvorado/data/{clickhouse,kafka} &&
        echo "/dev/vg_flow/lv_flows /var/lib/akvorado/data xfs defaults 0 0" >> /etc/fstab &&
        mount -a &&
        chcon -R -t container_file_t /var/lib/akvorado/data; fi' ]

  # 2. Docker Engine + Compose plugin from the official Docker repo (RHEL 9).
  - [ dnf, config-manager, --add-repo, https://download.docker.com/linux/rhel/docker-ce.repo ]
  - [ dnf, install, -y, docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin ]
  - [ systemctl, enable, --now, docker ]

  # 3. firewalld baseline, zones for exporters/mgmt/zabbix.
  - [ systemctl, enable, --now, firewalld ]
  - [ bash, -lc, '/opt/akvorado/provisioning/firewalld-apply.sh "${EXPORTER_CIDRS}" "${NOC_MGMT_CIDRS}" "${ZABBIX_SERVER_IP}"' ]

  # 4. SELinux booleans needed by containers + the flow-api nginx reverse proxy
  #    to talk to local PHP-FPM.
  - [ setsebool, -P, container_manage_cgroup, "on" ]
  - [ setsebool, -P, httpd_can_network_connect, "on" ]

  # 5. Single supported bring-up path. The orchestrator enforces order:
  #    docker compose up (stack) → wait for Akvorado schema →
  #    generate flow-api secrets → apply ClickHouse compat view/user →
  #    install + start flow-api → validate console reachability.
  - [ bash, -lc, 'cd /opt/akvorado && bin/stack-up.sh --from-cloud-init' ]
  - [ systemctl, enable, --now, zabbix-agent2 ]
