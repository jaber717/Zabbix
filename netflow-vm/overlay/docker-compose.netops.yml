---
# NetOps overlay for the official Akvorado v2026.10.0 compose.
# Applied via: COMPOSE_FILE=upstream/akvorado-v2026.10.0/docker/docker-compose.yml:overlay/docker-compose.netops.yml
#
# Scope:
#   1. Rebind Traefik's public entrypoint (8081) to loopback. flow-api/nginx is
#      the only off-box service; it proxies /akvorado/ to this entrypoint.
#   2. Pin host paths for the flow data volumes to the dedicated LV.
#   3. Journald log driver with per-container tags.
#   4. Mount our hard-caps profile under users.d.
#   5. REMOVE the upstream `console-auth` demo middleware so the console sees
#      the Remote-User header our nginx attaches instead of a static "alfred".
#      Upstream labels are rebuilt here with override-aware label keys that
#      supersede the demo values; see upstream docker-compose.yml for the
#      ones we're overriding.

services:
  traefik:
    ports: !override
      - 127.0.0.1:8080:8080/tcp
      - 127.0.0.1:8081:8081/tcp
    logging: {driver: journald, options: {tag: akvorado-traefik}}

  akvorado-inlet:
    logging: {driver: journald, options: {tag: akvorado-inlet}}

  akvorado-outlet:
    logging: {driver: journald, options: {tag: akvorado-outlet}}

  akvorado-orchestrator:
    logging: {driver: journald, options: {tag: akvorado-orchestrator}}

  akvorado-console:
    # Remove the upstream demo auth middleware — it sets Remote-User=alfred
    # unconditionally. We supply the identity from nginx. The console router
    # label is reset without `.middlewares=console-auth` and the middleware
    # itself has its header-setter labels removed by setting them empty.
    labels:
      - traefik.enable=true
      - traefik.http.routers.akvorado-console-debug.rule=PathPrefix(`/debug`)
      - traefik.http.routers.akvorado-console-debug.entrypoints=private
      - traefik.http.routers.akvorado-console-debug.service=akvorado-console
      - traefik.http.routers.akvorado-console-metrics.rule=PathPrefix(`/api/v0/console/metrics`)
      - traefik.http.routers.akvorado-console-metrics.service=akvorado-console
      - traefik.http.routers.akvorado-console-metrics.observability.accesslogs=false
      - "traefik.http.routers.akvorado-console.rule=!PathPrefix(`/debug`)"
      - traefik.http.routers.akvorado-console.priority=1
      # NO .middlewares=console-auth here. We rely on nginx Basic Auth +
      # trusted X-Forwarded-* + Remote-User header from nginx.
      - traefik.http.services.akvorado-console.loadbalancer.server.port=8080
      - metrics.enable=true
      - metrics.path=/api/v0/metrics
    logging: {driver: journald, options: {tag: akvorado-console}}

  kafka:
    logging: {driver: journald, options: {tag: akvorado-kafka}}

  clickhouse:
    volumes:
      - ../overlay/clickhouse/users.d/zbx-flow-ro-profile.xml:/etc/clickhouse-server/users.d/zbx-flow-ro-profile.xml:ro,z
    logging: {driver: journald, options: {tag: akvorado-clickhouse}}

volumes:
  akvorado-clickhouse:
    driver: local
    driver_opts: {type: none, o: bind, device: /var/lib/akvorado/data/clickhouse}
  akvorado-kafka:
    driver: local
    driver_opts: {type: none, o: bind, device: /var/lib/akvorado/data/kafka}
