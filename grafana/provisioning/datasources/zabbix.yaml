# Grafana datasource provisioning — reads live Zabbix via the official
# Zabbix datasource plugin (alexanderzobnin-zabbix-datasource).
#
# Codex delivers grafana-01 with the plugin installed; this file is dropped
# at /etc/grafana/provisioning/datasources/zabbix.yaml and Grafana loads it
# on service start / SIGHUP. UID is pinned to "zbx-noc" so dashboard JSON
# stays portable.
#
# ZABBIX_URL, ZABBIX_GRAFANA_USER, and ZABBIX_GRAFANA_PASSWORD come from
# claude-access/{claude-access.env,grafana.env} and are substituted by
# apply-grafana.sh (files mode) using `envsubst` at deploy time. The literal
# values NEVER appear in Git.

apiVersion: 1

datasources:
  - name: Zabbix NOC
    uid: zbx-noc
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: ${ZABBIX_URL}
    editable: false
    isDefault: true
    jsonData:
      username: ${ZABBIX_GRAFANA_USER}
      trends: true
      trendsFrom: "7d"
      trendsRange: "4d"
      cacheTTL: "60s"
      alerting: false
      disableReadOnlyUsersAck: true
      tlsSkipVerify: true   # LAB only; replace with internal CA mount in prod
    secureJsonData:
      password: ${ZABBIX_GRAFANA_PASSWORD}
