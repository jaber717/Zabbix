# Approved LAB hardware inventory. INTENTIONALLY EMPTY.
#
# 2026-10-09 discovery (docs/LAB-DISCOVERY-2026-10-09.md): no LAB host has a verified, fresh physical fan / PSU / temperature / redundancy
# sensor. The PNET routers are IOSv, the DR network hosts are mock objects. Do not add a host until a real model and its components are
# evidenced. A host entry is a CLAIM that is then checked against live Zabbix by `hardware_audit.py audit`:
#
# hosts:
#   <zabbix host name>:
#     site: SITE-A
#     vendor: cisco | paloalto | fortinet | huawei
#     family: <id from config/vendors.yaml>
#     model: "<exact model, human-verified>"
#     expected: [fan, power, temperature, hw_redundancy, ha]     # 'ha' (cluster state) is NOT 'hw_redundancy' (fan/PSU redundancy)
#     not_applicable:                                            # N/A needs model-specific proof, never implicit
#       hw_redundancy: {evidence: "<document / capture proving this model has no such component>"}
#     max_sensor_age_minutes: 480
#     sensors:                                                   # ONE entry per physical sensor ITEM (never a raw walk)
#       - {category: fan, key: "<exact item key>", slot: "Fan tray 1", semantics: <id in status-semantics.yaml>}
#       - {category: temperature, key: "<exact item key>", slot: "Inlet", units: C, plausible_range: [0, 120]}
environment: lab
hosts: {}
