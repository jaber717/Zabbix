# Fortinet FortiProxy: NO SENSOR DEFINITION. Reviewed 2026-10-09 (docs/VENDOR-SOURCES-REVIEW.md section 2).
# Verified: the FortiProxy 7.2 administration guide ("Fortinet MIBs") says SNMP needs FORTINET-CORE-MIB and FORTINET-FORTIPROXY-MIB, and gives one OID
#           (fchSysVersion 1.3.6.1.4.1.12356.109.4.1.1.0): FortiProxy has its OWN arc (12356.109), not FortiGate's (12356.101).
# Not found: any hardware sensor object (fan / PSU / temperature) for FortiProxy. The page lists none; FORTINET-FORTIPROXY-MIB is not in the public
#           LibreNMS mirror; Fortinet's FortiGate sensor article says its sensor OID structure is FortiGate-specific. The MIB is available from Fortinet support.
# FortiGate OIDs are NOT assumed to apply.
